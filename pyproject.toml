[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kajenn-public-site"
version = "0.1.0"
description = "Filesystem catalog and immutable editorial sources for Kajenn"
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["genro-storage>=0.8.1,<0.9", "kajenn==0.5.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/kajenn_public_site"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"
