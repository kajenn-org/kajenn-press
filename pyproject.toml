[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kajenn-press"
version = "0.1.0"
description = "Filesystem catalog and immutable editorial sources for Kajenn"
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["genro-bag>=0.28,<0.29", "genro-storage>=0.8.4,<0.9", "kajenn==0.7.0"]

[project.optional-dependencies]
admin = ["gramlot==0.3.20", "gramlot-py-server==0.3.20"]
dev = ["pytest>=8", "ruff>=0.14"]
help = ["anthropic>=2.3,<3"]
publish = ["dnspython>=2.8,<3"]
release-s3 = ["genro-storage[s3]>=0.8.4,<0.9"]
render = ["gramlot==0.3.8", "genro-builders==0.30.0", "genro-bag==0.28.0",
          "markdown-it-py==4.2.0", "nh3==0.3.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/kajenn_press"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"
