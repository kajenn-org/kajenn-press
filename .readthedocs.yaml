# Read the Docs publishes the xmldocs booklets and proposals as they are rendered in the
# repository (HTML beside each XML); no build tool runs.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - mkdir -p $READTHEDOCS_OUTPUT/html
    - cp xmldocs/index.html $READTHEDOCS_OUTPUT/html/
    - mkdir -p $READTHEDOCS_OUTPUT/html/booklet $READTHEDOCS_OUTPUT/html/proposal
    - cp xmldocs/booklet/*.html $READTHEDOCS_OUTPUT/html/booklet/
    - cp xmldocs/proposal/*.html $READTHEDOCS_OUTPUT/html/proposal/
