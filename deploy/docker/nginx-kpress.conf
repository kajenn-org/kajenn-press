# nginx on the server host, in front of websites (127.0.0.1:8875). Copy to
# /etc/nginx/sites-available/kpress and link it in sites-enabled.
# The certificate is issued with certbot (webroot /var/www/kpress-acme) before the 443
# block is enabled. The name must match KPRESS_MANAGEMENT_HOST in deploy/docker/.env,
# with KPRESS_SCHEME=https.
# nginx 1.24: http2 on the listen line ("http2 on" needs 1.25.1).

server {
    listen 80;
    server_name kpress.genro.com;
    location /.well-known/acme-challenge/ { root /var/www/kpress-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name kpress.genro.com;

    ssl_certificate     /etc/letsencrypt/live/kpress.genro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kpress.genro.com/privkey.pem;

    # Site imports and assets travel base64 inside JSON.
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8875;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
