# Release storage on an external S3-compatible bucket (e.g. Hetzner Object Storage) instead of RustFS.
# docker compose -f deploy/docker/compose.yaml -f deploy/docker/compose.external-s3.yaml up -d --build
# The bucket must exist. Its access and secret keys are two files, `access` and `secret`, in the
# host directory KPRESS_S3_CREDENTIALS_DIR, mounted read-only.

services:
  rustfs:
    profiles: ["rustfs"]

  storage-init:
    profiles: ["rustfs"]

  # The demo site publisher needs site sources; not part of the external-bucket setup.
  site-publisher:
    profiles: !override ["press-demo"]

  site-server:
    profiles: !override ["press-demo"]

  websites:
    environment:
      RELEASE_S3_ENDPOINT: ${KPRESS_S3_ENDPOINT:?set in .env}
      RELEASE_S3_BUCKET: ${KPRESS_S3_BUCKET:?set in .env}
      RELEASE_S3_BASE_PATH: ${KPRESS_S3_BASE_PATH:-}
      RELEASE_S3_ACCESS_FILE: /s3-credentials/access
      RELEASE_S3_SECRET_FILE: /s3-credentials/secret
      # Site sources: a separate versioned bucket; empty turns the site operations off.
      SOURCES_S3_ENDPOINT: ${KPRESS_S3_ENDPOINT}
      SOURCES_S3_BUCKET: ${KPRESS_SOURCES_BUCKET:-}
      SOURCES_S3_ACCESS_FILE: /s3-credentials/access
      SOURCES_S3_SECRET_FILE: /s3-credentials/secret
    volumes:
      - ${KPRESS_S3_CREDENTIALS_DIR:?set in .env}:/s3-credentials:ro
    depends_on: !override
      secrets:
        condition: service_completed_successfully

  child:
    environment:
      RELEASE_S3_ENDPOINT: ${KPRESS_S3_ENDPOINT}
      RELEASE_S3_BUCKET: ${KPRESS_S3_BUCKET}
      RELEASE_S3_BASE_PATH: ${KPRESS_S3_BASE_PATH:-}
      RELEASE_S3_ACCESS_FILE: /s3-credentials/access
      RELEASE_S3_SECRET_FILE: /s3-credentials/secret
    volumes:
      - ${KPRESS_S3_CREDENTIALS_DIR}:/s3-credentials:ro
