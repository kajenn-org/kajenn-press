# Local websites composition: RustFS release storage, websites, a builder and one child.
# Start from the repository root: docker compose -f deploy/docker/compose.yaml up --build
name: kajenn-websites

services:
  secrets:
    image: python:3.12-slim@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
    command: ["python", "/deploy/credentials.py"]
    volumes:
      - ./credentials.py:/deploy/credentials.py:ro
      - rustfs-secrets:/rustfs
      - websites-secrets:/websites
      - child-secrets:/child

  rustfs:
    image: rustfs/rustfs@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    environment:
      RUSTFS_ACCESS_KEY_FILE: /secrets/access
      RUSTFS_SECRET_KEY_FILE: /secrets/secret
    volumes:
      - rustfs-secrets:/secrets:ro
      - rustfs-data:/data
    depends_on:
      secrets:
        condition: service_completed_successfully

  storage-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    entrypoint: ["sh", "/deploy/storage-init.sh"]
    volumes:
      - ./storage-init.sh:/deploy/storage-init.sh:ro
      - rustfs-secrets:/rustfs:ro
      - websites-secrets:/websites:ro
      - child-secrets:/child:ro
    depends_on:
      rustfs:
        condition: service_started

  websites:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.websites
    image: kajenn-websites:local
    environment:
      WEBSITES_MANAGEMENT_ORIGIN: http://127.0.0.1:8875
      WEBSITES_PREVIEW_ORIGIN: http://localhost:8875
    ports:
      - "127.0.0.1:8875:8875"
    volumes:
      - websites-secrets:/secrets:ro
      - websites-data:/data
    depends_on:
      storage-init:
        condition: service_completed_successfully

  builder:
    image: kajenn-websites:local
    command:
      - python
      - /app/kajenn_org/build.py
      - --endpoint=http://websites:8875
      - --host=127.0.0.1:8875
      - --token-file=/secrets/token
      - --public-origin=http://kajenn.localhost:8876
      - --serving-address=http://127.0.0.1:8876
      - --state=/config/build-state.json
      - --child-config=/config/child.json
    volumes:
      - websites-secrets:/secrets:ro
      - child-config:/config
    depends_on:
      websites:
        condition: service_started

  child:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.child
    image: kajenn-child:local
    environment:
      CHILD_CACHE_SECONDS: "5"
    ports:
      - "127.0.0.1:8876:8876"
    volumes:
      - child-secrets:/secrets:ro
      - child-config:/config:ro
    depends_on:
      builder:
        condition: service_completed_successfully

volumes:
  rustfs-secrets:
  rustfs-data:
  websites-secrets:
  websites-data:
  child-secrets:
  child-config:
