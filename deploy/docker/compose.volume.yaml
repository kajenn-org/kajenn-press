# Release storage on a shared Docker volume instead of RustFS (local backend, genro-storage >= 0.8.4).
# docker compose -f deploy/docker/compose.yaml -f deploy/docker/compose.volume.yaml up -d --build
# Same host only: the volume is shared between containers, not between machines.

services:
  rustfs:
    profiles: ["s3"]

  storage-init:
    profiles: ["s3"]

  releases-init:
    image: python:3.12-slim@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
    # websites (uid 10002) writes; the child (uid 10003) only reads.
    command: ["sh", "-c", "chown 10002:10002 /releases && chmod 755 /releases"]
    volumes:
      - releases:/releases

  websites:
    environment:
      RELEASE_STORAGE: local
      # Site sources need a versioned S3 bucket; without RustFS the site operations are off.
      SOURCES_S3_BUCKET: ""
    volumes:
      - releases:/releases
    depends_on: !override
      releases-init:
        condition: service_completed_successfully
      secrets:
        condition: service_completed_successfully

  child:
    environment:
      RELEASE_STORAGE: local
    volumes:
      - releases:/releases:ro

volumes:
  releases:
